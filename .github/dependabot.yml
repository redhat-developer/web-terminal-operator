version: 2
updates:
  # Enable version updates for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "1.11.x"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "1.13.x"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "1.14.x"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "1.15.x"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "1.16.x"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "1.17.x"
    schedule:
      interval: "weekly"
    groups:
      go-dependencies:
        patterns:
          - "*"
  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/build/dockerfiles"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/build/dockerfiles"
    target-branch: "1.11.x"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/build/dockerfiles"
    target-branch: "1.13.x"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/build/dockerfiles"
    target-branch: "1.14.x"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/build/dockerfiles"
    target-branch: "1.15.x"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/build/dockerfiles"
    target-branch: "1.16.x"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/build/dockerfiles"
    target-branch: "1.17.x"
    schedule:
      interval: "weekly"
